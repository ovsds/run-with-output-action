name: "Setup Environment"
description: "Setting environment for the project"

inputs:
  mise-version:
    description: "Mise version, tools are pinned in mise.toml"
    required: true
    default: "2026.10.17"

runs:
  using: "composite"
  steps:
    - name: Setup mise
      uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      with:
        version: ${{ inputs.mise-version }}
